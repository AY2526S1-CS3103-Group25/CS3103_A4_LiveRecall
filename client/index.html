<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #status { font-weight: 700; }
    #live { min-height: 6rem; max-height: min(24rem, 50vh); overflow-y: auto; border: 1px solid #bbb; border-radius: .4rem; padding: 1rem; margin: 1rem 0; }
    .caption-line { padding: .25rem 0; border-bottom: 1px dotted #ddd; overflow-wrap: anywhere; }
    .caption-provisional { color: #555; font-style: italic; }
    .caption-final { color: #222; font-style: normal; }
    button { padding: .55rem .75rem; margin: .2rem; }
    #recall { white-space: pre-wrap; margin-top: 1rem; border-left: 3px solid #ccc; padding-left: 1rem; }
    .hint { font-size: .9rem; color: #555; }
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status">disconnected</span></p>
  <p class="hint">PROVISIONAL captions may change as you listen. FINAL captions are complete. Newer revisions replace the same line.</p>
  <div id="live" tabindex="0" role="region" aria-label="Live captions"></div>
  <p id="live-empty" class="hint" role="status">Waiting for captions.</p>
  <div>
    <button data-seconds="30">What did I miss? (30 s)</button>
    <button data-seconds="15">15 s</button>
    <button data-seconds="60">60 s</button>
  </div>
  <div id="recall">TODO: implement the locally maintained recall view.</div>
  <script src="app.js"></script>
</body>
</html>
