<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #status { font-weight: 700; }
    .status-connected { color: #15803d; }
    .status-offline { color: #b91c1c; }
    #live { min-height: 6rem; max-height: min(24rem, 50vh); overflow-y: auto; border: 1px solid #bbb; border-radius: .4rem; padding: 1rem; margin: 1rem 0; }
    .caption-line { padding: .25rem 0; border-bottom: 1px dotted #ddd; overflow-wrap: anywhere; }
    .caption-provisional { color: #555; font-style: italic; }
    .caption-final { color: #222; font-style: normal; }
    button { padding: .55rem .75rem; margin: .2rem; min-height: 44px; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #222; color: #fff; border-color: #222; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #222; outline-offset: 3px; }
    #recall { white-space: pre-wrap; max-height: min(24rem, 50vh); overflow-y: auto; border: 1px solid #bbb; border-radius: .4rem; padding: 1rem; }
    .hint { font-size: .9rem; color: #555; }
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status" class="status-offline" role="status">disconnected</span></p>
  <p class="hint">PROVISIONAL captions may change as you listen. FINAL captions are complete. Newer revisions replace the same line.</p>
  <div id="live" tabindex="0" role="region" aria-label="Live captions"></div>
  <p id="live-empty" class="hint" role="status">Waiting for captions.</p>
  <div role="group" aria-label="Recall window">
    <button type="button" data-seconds="30" aria-controls="recall" aria-pressed="true">What did I miss? (30 s)</button>
    <button type="button" data-seconds="15" aria-controls="recall" aria-pressed="false">15 s</button>
    <button type="button" data-seconds="60" aria-controls="recall" aria-pressed="false">60 s</button>
  </div>
  <h2 id="recall-heading">Previous 30 seconds</h2>
  <p id="recall-empty" class="hint" role="status">No finalized captions in the previous 30 seconds.</p>
  <div id="recall" tabindex="0" role="region" aria-labelledby="recall-heading" hidden></div>
  <script src="app.js"></script>
</body>
</html>
